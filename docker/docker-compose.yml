version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: auth_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce_rabbitmq

    restart: always

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  rabbitmq_data: